<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07080f">
<title>لوحة التحكم — إشارات إيدي</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#07080f;color:#e9ecf5;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
       padding:16px calc(16px + env(safe-area-inset-right)) 40px;min-height:100vh}
  h2{font-size:19px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  .card{background:#111527;border:1px solid #232842;border-radius:16px;padding:14px}

  /* بوابة الدخول */
  #gate{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
  #gate h1{font-size:28px}
  #gate p{opacity:.7;font-size:15px;max-width:26em;line-height:1.8}
  button{font-family:inherit;cursor:pointer;border:0;border-radius:12px}
  .primary{padding:14px 34px;font-size:17px;font-weight:800;color:#07080f;
    background:linear-gradient(135deg,#ffd93b,#ff9f1c)}
  .ghost{padding:8px 14px;font-size:13px;background:#1b2138;color:#c9d0e6;border:1px solid #2c3352}
  .danger{padding:8px 14px;font-size:13px;font-weight:700;background:#3a1220;color:#ff8a8a;border:1px solid #6b1f33}
  .ok{padding:8px 14px;font-size:13px;font-weight:700;background:#0f2e1d;color:#6ee7a0;border:1px solid #1d5c39}

  /* الهيدر والأرقام */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  header h1{font-size:20px}
  #who{font-size:12px;opacity:.6}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
  .stat{background:#111527;border:1px solid #232842;border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-size:24px;line-height:1.4}
  .stat span{font-size:12px;opacity:.65}

  /* المخالفات */
  #vios{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .vio img{width:100%;border-radius:10px;display:block;background:#000;aspect-ratio:4/3;object-fit:cover}
  .vio .no-img{width:100%;aspect-ratio:4/3;border-radius:10px;background:#1b2138;
    display:flex;align-items:center;justify-content:center;font-size:34px;opacity:.5}
  .vio h3{font-size:15px;margin:9px 0 2px}
  .vio small{display:block;font-size:11.5px;opacity:.6;line-height:1.7}
  .vio .row{display:flex;gap:6px;margin-top:10px}

  /* جدول الزوار */
  #search{width:100%;padding:12px 14px;border-radius:12px;background:#111527;
    border:1px solid #232842;color:#fff;font-size:15px;font-family:inherit;margin-bottom:10px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
  th,td{padding:11px 9px;text-align:right;border-bottom:1px solid #1d2238;white-space:nowrap}
  th{font-size:12px;opacity:.6;font-weight:600;position:sticky;top:0;background:#07080f}
  tr.banned td{opacity:.45}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddc84;margin-left:6px}
  .tag{font-size:11px;padding:3px 8px;border-radius:99px;background:#3a1220;color:#ff8a8a;border:1px solid #6b1f33}
  .muted{opacity:.5;font-size:14px;padding:18px 4px;text-align:center}
  .warn{background:#2a1a08;border:1px solid #6b4a12;color:#ffcf8a;padding:14px;border-radius:14px;
    font-size:14px;line-height:1.9;margin-bottom:14px}
  code{background:#1b2138;padding:2px 6px;border-radius:6px;font-size:12.5px}
</style>
</head>
<body>

<div id="gate">
  <div style="font-size:52px">🔒</div>
  <h1>لوحة التحكم</h1>
  <p>هاي الصفحة لصاحب الموقع بس. سجّل دخول بحساب جوجل تبعك.</p>
  <button id="login" class="primary">دخول بحساب جوجل</button>
  <p id="gateMsg" style="color:#ff8a8a"></p>
</div>

<div id="panel" hidden>
  <header>
    <div>
      <h1>لوحة التحكم 🛡️</h1>
      <div id="who"></div>
    </div>
    <button id="logout" class="ghost">خروج</button>
  </header>

  <div class="stats">
    <div class="stat"><b id="sUsers">0</b><span>زائر</span></div>
    <div class="stat"><b id="sToday">0</b><span>نشط اليوم</span></div>
    <div class="stat"><b id="sVios">0</b><span>مخالفة</span></div>
    <div class="stat"><b id="sBans">0</b><span>محظور</span></div>
  </div>

  <h2>🚨 المخالفات</h2>
  <div id="vios"></div>
  <div id="viosEmpty" class="muted">ما في ولا مخالفة — الناس مؤدبة 👏</div>

  <h2>👥 الزوار</h2>
  <input id="search" placeholder="دوّر باسم أو بلد…" autocomplete="off">
  <div class="card scroll">
    <table>
      <thead><tr>
        <th>الاسم</th><th>المكان</th><th>آخر ظهور</th>
        <th>زيارات</th><th>إشارات</th><th>مخالفات</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="rowsEmpty" class="muted">لسه ما فتح الموقع حدا.</div>
  </div>
</div>

<script type="module">
import { firebaseConfig, OWNER_EMAIL, isConfigured } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
         getRedirectResult, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, onValue, set, remove }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const $ = id => document.getElementById(id);
const gate = $('gate'), panel = $('panel'), gateMsg = $('gateMsg');

if (!isConfigured){
  gate.innerHTML = `<div class="warn" style="max-width:34em">
    ⚙️ لسه ما ربطنا Firebase.<br>افتح ملف <code>firebase-config.js</code> وحُط فيه بيانات مشروعك،
    بعدين ارفع التعديل. لحد ساعتها الموقع بيشتغل عادي بس بدون تسجيل ولا حظر.</div>`;
  throw new Error('not configured');
}

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

/* ---------- الدخول ---------- */
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

$('login').onclick = async () => {
  gateMsg.textContent = '';
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')
      return signInWithRedirect(auth, provider);
    gateMsg.textContent = 'ما زبط الدخول: ' + (e.code || e.message);
  }
};
$('logout').onclick = () => signOut(auth);
getRedirectResult(auth).catch(() => {});

onAuthStateChanged(auth, user => {
  if (!user){ gate.hidden = false; panel.hidden = true; return; }
  if (user.email !== OWNER_EMAIL){
    gateMsg.textContent = 'هاد الحساب ما إله صلاحية. سجّل دخول بحسابك أنت.';
    signOut(auth); return;
  }
  gate.hidden = true; panel.hidden = false;
  $('who').textContent = user.email;
  listen();
});

/* ---------- قراءة البيانات ---------- */
let users = {}, bans = {}, vios = {}, started = false;

function listen(){
  if (started) return; started = true;
  onValue(ref(db, 'users'),      s => { users = s.val() || {}; render(); });
  onValue(ref(db, 'bans'),       s => { bans  = s.val() || {}; render(); });
  onValue(ref(db, 'violations'), s => { vios  = s.val() || {}; render(); });
}

const fmt = t => t ? new Intl.DateTimeFormat('ar-JO-u-nu-latn',
  { timeZone:'Asia/Amman', dateStyle:'short', timeStyle:'short' }).format(new Date(t)) : '—';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const place = u => [u.city, u.country].filter(Boolean).join('، ') || '—';

/* ---------- الحظر ---------- */
async function ban(uid){
  const name = users[uid]?.name || '';
  const reason = prompt(`سبب حظر "${name || uid.slice(0,6)}"؟`, 'إشارة مسيئة');
  if (reason === null) return;
  await set(ref(db, 'bans/' + uid), { reason: reason.slice(0,100), at: Date.now(), name: (name||'').slice(0,24) });
}
async function unban(uid){
  if (confirm('أكيد بدك ترفع الحظر؟')) await remove(ref(db, 'bans/' + uid));
}
async function delVio(id){
  if (confirm('احذف هاي المخالفة؟')) await remove(ref(db, 'violations/' + id));
}
window.__admin = { ban, unban, delVio };   // للأزرار

/* ---------- الرسم ---------- */
function render(){
  const now = Date.now(), DAY = 864e5;
  const list = Object.entries(users);

  $('sUsers').textContent = list.length;
  $('sToday').textContent = list.filter(([,u]) => now - (u.lastSeen||0) < DAY).length;
  $('sVios').textContent  = Object.keys(vios).length;
  $('sBans').textContent  = Object.keys(bans).length;

  // المخالفات — الأحدث فوق
  const vl = Object.entries(vios).sort((a,b) => (b[1].t||0) - (a[1].t||0));
  $('viosEmpty').hidden = vl.length > 0;
  $('vios').innerHTML = vl.map(([id, v]) => {
    const isBanned = !!bans[v.uid];
    return `<div class="card vio">
      ${v.img ? `<img src="${esc(v.img)}" alt="لقطة">` : `<div class="no-img">📷</div>`}
      <h3>${esc(v.name) || 'بدون اسم'} ${isBanned ? '<span class="tag">محظور</span>' : ''}</h3>
      <small>${v.type === 'middle_finger' ? '🖕 إشارة مسيئة' : esc(v.type)}</small>
      <small>${fmt(v.t)}</small>
      <small>${esc(v.place) || '—'}</small>
      <div class="row">
        ${isBanned
          ? `<button class="ok" onclick="__admin.unban('${v.uid}')">رفع الحظر</button>`
          : `<button class="danger" onclick="__admin.ban('${v.uid}')">🔨 حظر</button>`}
        <button class="ghost" onclick="__admin.delVio('${id}')">حذف</button>
      </div>
    </div>`;
  }).join('');

  // الزوار — الأحدث ظهوراً فوق
  const q = $('search').value.trim().toLowerCase();
  const rows = list
    .sort((a,b) => (b[1].lastSeen||0) - (a[1].lastSeen||0))
    .filter(([,u]) => !q || (u.name||'').toLowerCase().includes(q) || place(u).toLowerCase().includes(q));

  $('rowsEmpty').hidden = rows.length > 0;
  $('rows').innerHTML = rows.map(([uid, u]) => {
    const isBanned = !!bans[uid];
    const online = now - (u.lastSeen||0) < 12e4;
    return `<tr class="${isBanned ? 'banned' : ''}">
      <td>${online ? '<span class="dot"></span>' : ''}${esc(u.name) || '—'}
          ${isBanned ? `<span class="tag">محظور</span>` : ''}</td>
      <td>${esc(place(u))}</td>
      <td>${fmt(u.lastSeen)}</td>
      <td>${u.visits || 0}</td>
      <td>${u.gestures || 0}</td>
      <td>${u.violations ? `<b style="color:#ff8a8a">${u.violations}</b>` : 0}</td>
      <td>${isBanned
        ? `<button class="ok" onclick="__admin.unban('${uid}')">رفع الحظر</button>`
        : `<button class="danger" onclick="__admin.ban('${uid}')">🔨 حظر</button>`}</td>
    </tr>`;
  }).join('');
}

$('search').oninput = render;
</script>
</body>
</html>
